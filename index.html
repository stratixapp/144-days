<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKELORA OfficeOS</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E🏢%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d12;--p1:#11151f;--p2:#171c2a;--bd:#262d40;--tx:#e8eaf0;--mu:#8b93a7;--am:#f5b82e;--ok:#3ecf8e;--er:#ef5b5b;--bl:#5b9bef;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}.sb{width:220px;background:var(--p1);border-right:1px solid var(--bd);padding:16px 10px;display:flex;flex-direction:column;gap:2px;flex:none;overflow:auto}
.brand{font-weight:600;letter-spacing:.08em;padding:4px 10px 16px;font-size:15px}.brand b{color:var(--am);font-weight:600}.brand i{display:inline-block;width:10px;height:10px;background:var(--am);margin-right:8px;border-radius:2px}
.sb a{color:var(--mu);text-decoration:none;padding:8px 10px;border-radius:6px;border-left:2px solid transparent}.sb a:hover{background:var(--p2);color:var(--tx)}.sb a.on{background:var(--p2);color:var(--am);border-left-color:var(--am)}
.sbf{margin-top:auto;font-size:11px;color:var(--mu);padding:10px;border-top:1px solid var(--bd)}.sbf b{color:var(--am);letter-spacing:.1em}
.mn{flex:1;display:flex;flex-direction:column;min-width:0}.tb{display:flex;gap:12px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--bd);background:var(--p1)}
.crumb{color:var(--mu);flex:1}.tb input{width:260px}#clk{color:var(--mu);font-variant-numeric:tabular-nums;font-size:12px}.av{background:var(--am);color:#111;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:600;font-size:12px}
main{flex:1;overflow:auto;padding:24px;animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(4px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{margin:0;font-size:22px}.sub{color:var(--mu);margin:2px 0 18px}h3{margin:0 0 12px;font-size:15px}.hd{display:flex;align-items:flex-start;gap:10px}.hd>div{flex:1}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{cursor:pointer;margin:0}.kpi:hover{border-color:var(--am)}.kpi b{display:block;font-size:28px;color:var(--am)}.kpi span{color:var(--mu);font-size:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--am);outline-offset:1px}
label{display:block;color:var(--mu);font-size:12px;margin-bottom:10px}label>*{display:block;width:100%;margin-top:4px;color:var(--tx)}textarea{min-height:110px;resize:vertical}
.btn{cursor:pointer}.btn:hover{border-color:var(--am)}.pri{background:var(--am);color:#111;border-color:var(--am);font-weight:600}.dn{color:var(--er)}.sm{padding:3px 8px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500;font-size:12px}tr:hover td{background:#ffffff05}.tw{overflow-x:auto}
.b{padding:2px 8px;border-radius:10px;font-size:11px;background:#ffffff12;color:var(--mu);text-transform:capitalize;white-space:nowrap}.b.approved,.b.done,.b.out,.b.confirmed{background:#3ecf8e22;color:var(--ok)}.b.submitted,.b.review,.b.in{background:#f5b82e22;color:var(--am)}.b.rejected,.b.cancelled,.b.high{background:#ef5b5b22;color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu)}.empty{padding:24px;text-align:center;color:var(--mu)}
.paper{background:#fff;color:#1a1d24;padding:34px 40px;border-radius:4px;font:13px/1.6 Georgia,serif;min-height:420px;position:relative}.paper .ph{border-bottom:2px solid #c99a10;padding-bottom:8px;margin-bottom:14px}.paper .ph small{display:block;color:#666;font:11px system-ui}
.paper h2{font:600 15px system-ui;letter-spacing:.12em;margin:0 0 10px}.paper .meta td{border:0;padding:1px 10px 1px 0;font:12px system-ui}.paper .meta td:first-child{color:#666;width:70px}.paper .bt{margin-top:16px;white-space:pre-wrap}
.stamp{position:absolute;right:30px;bottom:30px;border:3px solid #1a9a5a;color:#1a9a5a;padding:4px 14px;font:700 16px system-ui;transform:rotate(-8deg);letter-spacing:.1em}.stamp.r{border-color:#c33;color:#c33}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;animation:fade .15s}.md{background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:20px;width:min(560px,92vw);max-height:90vh;overflow:auto}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}.t{background:var(--p2);border:1px solid var(--bd);border-left:3px solid var(--ok);padding:10px 14px;border-radius:6px;animation:fade .2s}.t.e{border-left-color:var(--er)}
.bar{display:flex;align-items:flex-end;gap:18px;height:130px;padding-top:10px}.bar div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bar i{display:block;background:var(--am);border-radius:3px 3px 0 0;margin-bottom:4px;min-height:2px}
.pg{height:6px;background:var(--p2);border-radius:3px;overflow:hidden;margin:6px 0 10px}.pg i{display:block;height:100%;background:var(--ok)}.st{padding:3px 0}.st.d{color:var(--ok)}.st.n{color:var(--am)}
.pres .tb input,.pres .tb .btn+#clk,.pres .sbf{display:none}.pres main{padding:32px 48px}.ex{display:none;position:fixed;top:8px;right:10px;z-index:70;opacity:.5}.pres .ex{display:block}
@media print{body>#app,#toast,.ov,.ex{display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:20px}#pr .paper{padding:0}#pr table{color:#000}#pr th,#pr td{border-bottom:1px solid #999;color:#000}}
#pr{display:none}@media(max-width:860px){.sb{width:64px}.sb a{font-size:0}.sb a::first-letter{font-size:14px}.brand,.sbf{display:none}.tb input{width:120px}}
</style></head><body><div id="app"></div><div id="pr"></div><div id="toast"></div><div id="modal"></div><button class="btn ex" data-act="pres">Exit presentation</button>
<script>
'use strict';
const K='skelora_officeos_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),today=()=>dt(0),bg=s=>`<span class="b ${String(s).toLowerCase().replace(/ /g,'')}">${esc(s)}</span>`;
const DEPTS=['Administration','Operations','Procurement','Finance','HR'],ROOMS=['Orion','Vega','Atlas'],TYPES=['Memo','Official Letter','Notice','Meeting Agenda','Meeting Minutes','Transmittal'],TS=['To-do','In progress','Review','Done'];
const seed=()=>({n:100,flags:{},act:[],
emps:[['Aditi Rao','Office Administrator','Administration','Meera Pillai'],['Rohan Mehta','Operations Executive','Operations','Meera Pillai'],['Meera Pillai','Department Manager','Administration','—'],['Vikram Singh','Procurement Officer','Procurement','Meera Pillai'],['Sana Iqbal','Accounts Executive','Finance','Meera Pillai'],['Kabir Nair','HR Coordinator','HR','Meera Pillai'],['Leena Thomas','Front Desk Executive','Administration','Aditi Rao'],['Arjun Das','Facilities Supervisor','Operations','Rohan Mehta']].map((e,i)=>({id:'EMP-'+(201+i),name:e[0],role:e[1],dept:e[2],mgr:e[3],email:e[0].split(' ')[0].toLowerCase()+'@asteron.example'})),
mail:[{id:'IN-001',from:'Meera Pillai',subj:'Request: Q3 office supplies budget memo',pri:'High',date:today(),body:'Please prepare an official memo to Finance requesting approval of the Q3 office supplies budget of INR 85,000. Include the breakdown for stationery, toner and pantry items.',read:0},{id:'IN-002',from:'Vendor: Nova Stationers',subj:'Updated price list for October',pri:'Normal',date:today(),body:'Attached is our revised price list valid until 31 October.',read:0},{id:'IN-003',from:'Rohan Mehta',subj:'Visitor schedule for client audit',pri:'Normal',date:dt(-1),body:'Two auditors will visit on Friday. Kindly arrange passes.',read:0}],
docs:[],visitors:[{id:'VIS-001',name:'Priya Menon',org:'Nova Stationers',purpose:'Price negotiation',host:'Vikram Singh',inAt:'09:10',outAt:'09:55',date:dt(-1),seed:1}],
meetings:[{id:'MTG-001',title:'Weekly Operations Review',date:today(),start:'10:00',end:'11:00',room:'Orion',org:'Meera Pillai',att:['Rohan Mehta','Aditi Rao'],agenda:'1. Open items\n2. Facilities\n3. Procurement',status:'confirmed',seed:1},{id:'MTG-002',title:'Vendor Review',date:today(),start:'14:00',end:'15:00',room:'Vega',org:'Vikram Singh',att:['Sana Iqbal'],agenda:'Vendor performance',status:'confirmed',seed:1}],
tasks:[['Reconcile courier register','Aditi Rao','High',-2,'In progress'],['File Q2 correspondence','Leena Thomas','Normal',1,'To-do'],['Update asset register','Arjun Das','Normal',3,'Review'],['Prepare auditor passes','Leena Thomas','High',0,'To-do'],['Renew AMC for printers','Vikram Singh','Normal',-1,'Done'],['Draft leave policy notice','Kabir Nair','Normal',4,'Done'],['Book Atlas for training','Aditi Rao','Normal',2,'Done']].map((t,i)=>({id:'TSK-'+(101+i),title:t[0],owner:t[1],pri:t[2],due:dt(t[3]),status:t[4],seed:1})),
reqs:[{id:'PR-001',title:'Toner cartridges',vendor:'Nova Stationers',dept:'Administration',items:[{d:'Toner 85A',q:6,p:3200}],status:'fulfilled',seed:1}],vendors:['Nova Stationers','Prime Office Supplies','BlueLine Furniture']});
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.emps&&s.flags)return s}catch(e){}return seed()})(),page='dash',Q='',ST=null,RF={st:'',own:''},CF=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},log=m=>{S.act.unshift(new Date().toTimeString().slice(0,5)+' — '+m);S.act=S.act.slice(0,30)},nid=p=>p+'-'+String(++S.n).padStart(3,'0');
const toast=(m,e)=>{const t=document.createElement('div');t.className='t'+(e?' e':'');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),3200)};
const modal=h=>{$('#modal').innerHTML=`<div class="ov" data-act="mclose"><div class="md" role="dialog" aria-modal="true">${h}<div class="row" style="margin-top:14px"><button class="btn" data-act="mclose">Close</button></div></div></div>`};
const cf=(m,fn)=>{CF=fn;$('#modal').innerHTML=`<div class="ov"><div class="md"><p>${esc(m)}</p><div class="row"><button class="btn pri" data-act="cfy">Confirm</button><button class="btn" data-act="mclose">Cancel</button></div></div></div>`};
const csv=(name,rows,cols)=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',t=[cols.map(c=>q(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c[0]])).join(','))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'.csv';a.click();toast('Exported '+rows.length+' rows to '+name+'.csv')};
const prn=h=>{$('#pr').innerHTML=h;window.print()};
const tbl=(cols,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`;
const hdr=(t,s,a='')=>`<div class="hd"><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="row">${a}</div></div>`;
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join(''),enames=()=>S.emps.map(e=>e.name);
const paper=d=>`<div class="paper"><div class="ph"><b>ASTERON BUSINESS SERVICES</b><small>Training Scenario · Fictional organization · ${esc(d.dept||'Administration')} Department</small></div><h2>${esc((d.type||'Memo').toUpperCase())}</h2><table class="meta"><tr><td>Ref</td><td>${esc(d.ref||'(assigned on save)')}</td></tr><tr><td>Date</td><td>${esc(d.date||today())}</td></tr><tr><td>To</td><td>${esc(d.to)}</td></tr><tr><td>From</td><td>${esc(d.from)}</td></tr><tr><td>Subject</td><td><b>${esc(d.subject)}</b></td></tr></table><hr><div class="bt">${esc(d.body)}</div>${d.status=='approved'?'<div class="stamp">APPROVED</div>':d.status=='rejected'?'<div class="stamp r">REJECTED</div>':''}</div>`;
const total=r=>r.items.reduce((a,i)=>a+i.q*i.p,0),inr=n=>'INR '+n.toLocaleString('en-IN');
const NAV=[['dash','Command Centre'],['mail','Mailroom'],['docs','Document Studio'],['visitors','Front Office'],['meetings','Meetings'],['tasks','Tasks'],['proc','Procurement'],['people','Employees'],['reports','Reports'],['demo','Reel Demo Mode']];
const V={
dash(){const o=S.tasks.filter(t=>t.status!='Done').length,ap=S.docs.filter(d=>d.status=='submitted').length+S.reqs.filter(r=>r.status=='submitted').length,tm=S.meetings.filter(m=>m.date==today()&&m.status!='cancelled'),un=S.mail.filter(m=>!m.read).length,po=S.reqs.filter(r=>['draft','submitted'].includes(r.status)).length,mx=Math.max(1,...TS.map(s=>S.tasks.filter(t=>t.status==s).length));
return hdr('Office Operations Command Centre','Asteron Business Services — Training Scenario','<button class="btn pri" data-go="demo">Start Guided Demo</button>')+`<div class="grid g4">${[['Employees',S.emps.length,'people'],['Pending approvals',ap,'docs'],["Today's meetings",tm.length,'meetings'],['Open tasks',o,'tasks'],['Unread correspondence',un,'mail'],['Open procurement',po,'proc']].map(k=>`<div class="card kpi" data-go="${k[2]}" tabindex="0"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div><div class="grid g2"><div class="card"><h3>Tasks by status</h3><div class="bar">${TS.map(s=>{const n=S.tasks.filter(t=>t.status==s).length;return`<div><i style="height:${n/mx*100}px"></i>${n}<br>${s}</div>`}).join('')}</div></div><div class="card"><h3>Today's schedule</h3>${tm.length?tm.map(m=>`<div class="st">${m.start}–${m.end} · <b>${esc(m.title)}</b> <span class="mu">${m.room}</span></div>`).join(''):'<div class="empty">No meetings today.</div>'}</div><div class="card"><h3>Recent activity</h3>${S.act.length?S.act.slice(0,6).map(a=>`<div class="st mu">${esc(a)}</div>`).join(''):'<div class="empty">Activity appears as you work.</div>'}</div><div class="card"><h3>Pending action queue</h3>${S.docs.filter(d=>d.status=='submitted').map(d=>`<div class="st">Approve ${d.id} — ${esc(d.subject)}</div>`).concat(S.reqs.filter(r=>r.status=='submitted').map(r=>`<div class="st">Approve ${r.id} — ${esc(r.title)}</div>`)).join('')||'<div class="empty">Nothing awaiting approval.</div>'}</div></div>`},
mail(){return hdr('Mailroom','Incoming correspondence register')+`<div class="card">${tbl([['ID',r=>r.id],['From',r=>esc(r.from)],['Subject',r=>(r.read?'':'● ')+esc(r.subj)],['Priority',r=>bg(r.pri)],['Date',r=>r.date],['',r=>`<button class="btn sm" data-act="mopen" data-id="${r.id}">Open</button>`]],S.mail,'No mail.')}</div>`},
docs(){const q=Q.toLowerCase(),r=S.docs.filter(d=>!q||(d.id+d.subject+d.type+d.status).toLowerCase().includes(q));return hdr('Document Studio','Register of memos, letters, notices and forms','<input placeholder="Filter register…" data-q value="'+esc(Q)+'"><button class="btn pri" data-act="newdoc">New document</button><button class="btn" data-act="docsvcsv">Export CSV</button>')+`<div class="card">${tbl([['ID',d=>d.id],['Reference',d=>esc(d.ref)],['Type',d=>d.type],['Subject',d=>esc(d.subject)],['Status',d=>bg(d.status)],['',d=>`<button class="btn sm" data-act="edoc" data-id="${d.id}">Open</button> <button class="btn sm dn" data-act="ddoc" data-id="${d.id}">Archive</button>`]],r,'No documents yet. Create one with “New document”, or draft a memo from the Mailroom.')}</div>`},
studio(){const d=ST;return hdr(d.id?'Edit '+d.id:'New document','Live preview updates as you type',`<button class="btn" data-go="docs">Back</button>`)+`<div class="grid g2"><div class="card"><label>Type<select data-f="type">${opts(TYPES,d.type)}</select></label><label>Department<select data-f="dept">${opts(DEPTS,d.dept)}</select></label><label>To<input data-f="to" value="${esc(d.to)}"></label><label>From<input data-f="from" value="${esc(d.from)}"></label><label>Subject *<input data-f="subject" value="${esc(d.subject)}"></label><label>Body *<textarea data-f="body">${esc(d.body)}</textarea></label><div class="row"><button class="btn" data-act="sdraft">Save draft</button><button class="btn pri" data-act="ssub">Submit for approval</button>${d.status=='submitted'?'<button class="btn" data-act="sapp">Approve</button><button class="btn dn" data-act="srej">Reject</button>':''}<button class="btn" data-act="sprint">Print / PDF</button></div></div><div id="pv">${paper(d)}</div></div>`},
visitors(){return hdr('Front Office','Visitor register and passes')+`<div class="grid g2"><div class="card"><h3>Register visitor</h3><form data-form="vis"><label>Name *<input name="name"></label><label>Organization<input name="org"></label><label>Purpose *<input name="purpose"></label><label>Host *<select name="host">${opts(enames())}</select></label><button class="btn pri">Register</button></form></div><div class="card"><h3>Visitors</h3>${tbl([['ID',v=>v.id],['Name',v=>esc(v.name)+'<br><small class="mu">'+esc(v.org)+'</small>'],['Host',v=>esc(v.host)],['Status',v=>v.outAt?bg('out'):v.inAt?bg('in'):bg('expected')],['',v=>(v.inAt?'':`<button class="btn sm" data-act="vin" data-id="${v.id}">Check in</button>`)+(v.inAt&&!v.outAt?`<button class="btn sm" data-act="vout" data-id="${v.id}">Check out</button>`:'')+(v.inAt?` <button class="btn sm" data-act="vpass" data-id="${v.id}">Pass</button>`:'')]],S.visitors.slice().reverse(),'No visitors.')}</div></div>`},
meetings(){return hdr('Meetings & Rooms','Conflict detection is applied to every booking')+`<div class="grid g2"><div class="card"><h3>Schedule meeting</h3><form data-form="mtg"><label>Title *<input name="title"></label><div class="row"><label style="flex:1">Date<input type="date" name="date" value="${today()}"></label><label style="flex:1">Start<input type="time" name="start" value="09:00"></label><label style="flex:1">End<input type="time" name="end" value="10:00"></label></div><label>Room<select name="room">${opts(ROOMS)}</select></label><label>Attendees (Ctrl/Cmd-click)<select name="att" multiple size="4">${opts(enames())}</select></label><label>Agenda<textarea name="agenda"></textarea></label><button class="btn pri">Book meeting</button></form></div><div class="card"><h3>Calendar</h3>${tbl([['When',m=>m.date+'<br>'+m.start+'–'+m.end],['Meeting',m=>'<b>'+esc(m.title)+'</b><br><small class="mu">'+m.room+' · '+esc(m.att.join(', '))+'</small>'],['Status',m=>bg(m.status)],['',m=>`<button class="btn sm" data-act="magenda" data-id="${m.id}">Agenda</button>`+(m.status=='confirmed'?` <button class="btn sm dn" data-act="mcancel" data-id="${m.id}">Cancel</button>`:'')]],S.meetings.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),'No meetings.')}</div></div>`},
tasks(){const o=S.tasks.filter(t=>t.status!='Done'&&t.due<today()).length;return hdr('Task Planner',o+' overdue')+`<div class="grid g2"><div class="card"><h3>New task</h3><form data-form="tsk"><label>Title *<input name="title"></label><label>Owner<select name="owner">${opts(enames())}</select></label><label>Priority<select name="pri">${opts(['Normal','High'])}</select></label><label>Due<input type="date" name="due" value="${dt(2)}"></label><button class="btn pri">Create</button></form></div><div class="card">${tbl([['Task',t=>esc(t.title)+'<br><small class="mu">'+esc(t.owner)+'</small>'],['Due',t=>(t.status!='Done'&&t.due<today()?'<span style="color:var(--er)">'+t.due+'</span>':t.due)],['Status',t=>`<select data-chg="tstatus" data-id="${t.id}">${opts(TS,t.status)}</select>`]],S.tasks,'No tasks.')}</div></div>`},
proc(){return hdr('Procurement','Requisitions, approvals and purchase orders')+`<div class="grid g2"><div class="card"><h3>New requisition</h3><form data-form="req"><label>Title *<input name="title"></label><label>Vendor<select name="vendor">${opts(S.vendors)}</select></label><label>Department<select name="dept">${opts(DEPTS)}</select></label><label>Line items * — one per line: description, qty, unit price<textarea name="items" placeholder="A4 paper ream, 40, 280&#10;Whiteboard markers, 12, 45"></textarea></label><button class="btn pri">Create draft</button></form></div><div class="card">${tbl([['ID',r=>r.id],['Requisition',r=>esc(r.title)+'<br><small class="mu">'+esc(r.vendor)+' · '+inr(total(r))+'</small>'],['Status',r=>bg(r.status)],['',r=>(r.status=='draft'?`<button class="btn sm" data-act="rsub" data-id="${r.id}">Submit</button>`:'')+(r.status=='submitted'?`<button class="btn sm" data-act="rapp" data-id="${r.id}">Approve</button> <button class="btn sm dn" data-act="rrej" data-id="${r.id}">Reject</button>`:'')+(['approved','fulfilled'].includes(r.status)?`<button class="btn sm" data-act="rpo" data-id="${r.id}">PO preview</button>`:'')]],S.reqs.slice().reverse(),'No requisitions.')}</div></div>`},
people(){return hdr('Employee Directory','Fictional employees — synthetic data')+`<div class="card">${tbl([['ID',e=>e.id],['Name',e=>esc(e.name)],['Designation',e=>e.role],['Department',e=>e.dept],['Manager',e=>esc(e.mgr)],['Email',e=>e.email]],S.emps,'')}</div>`},
reports(){const r=S.tasks.filter(t=>(!RF.st||t.status==RF.st)&&(!RF.own||t.owner==RF.own)),dn=r.filter(t=>t.status=='Done').length;return hdr('Management Reports','Task performance with filters')+`<div class="card"><div class="row"><select data-rf="st"><option value="">All statuses</option>${opts(TS,RF.st)}</select><select data-rf="own"><option value="">All owners</option>${opts(enames(),RF.own)}</select><button class="btn" data-act="rcsv">Export CSV</button><button class="btn pri" data-act="rprint">Generate printable report</button></div></div><div class="grid g4"><div class="card kpi"><b>${r.length}</b><span>Tasks in view</span></div><div class="card kpi"><b>${r.length?Math.round(dn/r.length*100):0}%</b><span>Completion rate</span></div><div class="card kpi"><b>${r.filter(t=>t.status!='Done'&&t.due<today()).length}</b><span>Overdue</span></div></div><div class="card">${tbl([['ID',t=>t.id],['Task',t=>esc(t.title)],['Owner',t=>esc(t.owner)],['Due',t=>t.due],['Status',t=>bg(t.status)]],r,'No tasks match these filters.')}</div><div class="row"><button class="btn" data-act="allcsv" data-k="visitors">Visitors CSV</button><button class="btn" data-act="allcsv" data-k="meetings">Meetings CSV</button><button class="btn" data-act="allcsv" data-k="docs">Documents CSV</button></div>`},
demo(){const f=S.flags,own=a=>a.filter(x=>!x.seed),sc=[['1 · Executive Correspondence','mail',[['Open incoming request IN-001',()=>S.mail.some(m=>m.read)],['Draft & save a memo from it',()=>S.docs.some(d=>d.src)],['Submit it for approval',()=>S.docs.some(d=>d.src&&['submitted','approved'].includes(d.status))],['Approve and view final document',()=>S.docs.some(d=>d.src&&d.status=='approved')]]],['2 · Visitor Reception','visitors',[['Register a visitor',()=>own(S.visitors).length>0],['Check in',()=>own(S.visitors).some(v=>v.inAt)],['Display visitor pass',()=>f.pass],['Check out',()=>own(S.visitors).some(v=>v.outAt)]]],['3 · Meeting Coordination','meetings',[['Book Orion today 10:30–11:30 to trigger a conflict',()=>f.conflict],['Book a conflict-free meeting with attendees & agenda',()=>own(S.meetings).length>0],['Open its agenda',()=>f.agenda]]],['4 · Procurement Workflow','proc',[['Create a requisition with line items',()=>own(S.reqs).length>0],['Submit it',()=>own(S.reqs).some(r=>r.status!='draft')],['Approve it',()=>own(S.reqs).some(r=>r.status=='approved')],['Open the purchase order preview',()=>f.po]]],['5 · Management Reporting','reports',[['Filter task records',()=>f.filtered],['Generate printable report',()=>f.printed]]]];
return hdr('Reel Demo Mode','Scenarios complete automatically as you perform real actions','<button class="btn" data-act="pres">Presentation mode</button><button class="btn dn" data-act="reset">Reset demo data</button>')+sc.map(s=>{const d=s[2].filter(x=>x[1]()).length;return`<div class="card"><div class="row"><h3 style="flex:1;margin:0">${s[0]}</h3><button class="btn sm" data-go="${s[1]}">Go to module</button></div><div class="pg"><i style="width:${d/s[2].length*100}%"></i></div>${s[2].map((x,i)=>`<div class="st ${x[1]()?'d':''}">${x[1]()?'✓':(i==d?'<span class="n">▶</span>':'○')} ${x[0]}</div>`).join('')}<small class="mu">${d==s[2].length?'Complete':d+' of '+s[2].length+' steps'}</small></div>`}).join('')}};
const titles=Object.fromEntries(NAV.concat([['studio','Document Studio']]));
function render(){const y=$('main')?.scrollTop||0;$('#app').innerHTML=`<aside class="sb"><div class="brand"><i></i>SKELORA <b>OfficeOS</b></div>${NAV.map(n=>`<a href="#" data-go="${n[0]}" class="${page==n[0]||(n[0]=='docs'&&page=='studio')?'on':''}">${n[1]}</a>`).join('')}<div class="sbf"><b>TRAINING SIMULATOR</b><br>Local demo storage — not a secure enterprise database.</div></aside><div class="mn"><header class="tb"><span class="crumb">OfficeOS / ${titles[page]}</span><input id="gs" placeholder="Search records, press Enter" aria-label="Global search"><button class="btn" data-act="newdoc">+ New</button><button class="btn" data-act="notif">🔔</button><span id="clk"></span><span class="av" title="Aditi Rao, Office Administrator">AR</span></header><main>${V[page]()}</main></div>`;$('main').scrollTop=y;clk()}
const clk=()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})};setInterval(clk,15000);
const fd=f=>Object.fromEntries(new FormData(f));
const newD=(o={})=>({id:null,type:'Memo',dept:'Administration',to:'',from:'Aditi Rao, Office Administrator',subject:'',body:'',status:'draft',date:today(),...o});
function sv(st){const d=ST;if(!d.subject.trim()||!d.body.trim()){toast('Subject and body are required.',1);return false}
if(d.id){Object.assign(S.docs.find(x=>x.id==d.id),d,{status:st||d.status})}else{d.id=nid('DOC');d.ref=`AST/${d.dept.slice(0,3).toUpperCase()}/${new Date().getFullYear()}/${String(S.n).padStart(4,'0')}`;S.docs.push({...d})}
d.status=st||d.status;S.docs.find(x=>x.id==d.id).status=d.status;log(d.id+' '+d.status);save();return true}
const sd=()=>S.docs.find(x=>x.id==ST.id);
const A={mclose(e,ev){if(ev.target.closest('.md')&&!ev.target.closest('button'))return;$('#modal').innerHTML=''},cfy(){const f=CF;$('#modal').innerHTML='';f&&f()},
pres(){document.body.classList.toggle('pres');if(document.body.classList.contains('pres'))document.documentElement.requestFullscreen?.().catch(()=>{});else document.fullscreenElement&&document.exitFullscreen?.()},
notif(){modal('<h3>Notifications</h3>'+(S.act.slice(0,8).map(a=>`<div class="st mu">${esc(a)}</div>`).join('')||'<div class="empty">No notifications.</div>'))},
reset(){cf('Reset all demo data to the original state?',()=>{S=seed();save();page='demo';render();toast('Demo data reset.')})},
mopen(e){const m=S.mail.find(x=>x.id==e.dataset.id);m.read=1;save();modal(`<h3>${esc(m.subj)}</h3><p class="mu">${esc(m.from)} · ${m.date} · ${m.id}</p><p>${esc(m.body)}</p><button class="btn pri" data-act="mdraft" data-id="${m.id}">Draft memo reply</button>`);render()},
mdraft(e){const m=S.mail.find(x=>x.id==e.dataset.id);ST=newD({src:m.id,to:'Finance Department',subject:'Re: '+m.subj.replace(/^Request: /,''),body:'Dear Team,\n\nFurther to the request received from '+m.from+', kindly approve the proposed Q3 office supplies budget of INR 85,000, covering stationery, toner and pantry items.\n\nRegards,'});$('#modal').innerHTML='';page='studio';render()},
newdoc(){ST=newD();page='studio';render()},edoc(e){ST={...S.docs.find(d=>d.id==e.dataset.id)};page='studio';render()},
ddoc(e){cf('Archive '+e.dataset.id+'? It will be removed from the register.',()=>{S.docs=S.docs.filter(d=>d.id!=e.dataset.id);save();render();toast('Archived.')})},
sdraft(){if(sv('draft')){toast('Draft saved: '+ST.ref);render()}},ssub(){if(sv('submitted')){toast('Submitted for approval.');render()}},
sapp(){sd().status=ST.status='approved';log(ST.id+' approved');save();toast('Document approved.');render()},srej(){sd().status=ST.status='rejected';log(ST.id+' rejected');save();toast('Document rejected.',1);render()},
sprint(){if(!ST.subject.trim())return toast('Nothing to print yet.',1);prn(paper(ST))},
docsvcsv(){csv('document-register',S.docs,[['id','ID'],['ref','Reference'],['type','Type'],['subject','Subject'],['status','Status'],['date','Date']])},
vin(e){const v=S.visitors.find(x=>x.id==e.dataset.id);v.inAt=new Date().toTimeString().slice(0,5);log(v.name+' checked in');save();render();toast('Checked in.')},
vout(e){const v=S.visitors.find(x=>x.id==e.dataset.id);v.outAt=new Date().toTimeString().slice(0,5);log(v.name+' checked out');save();render();toast('Checked out.')},
vpass(e){const v=S.visitors.find(x=>x.id==e.dataset.id);S.flags.pass=1;save();modal(`<div class="paper" style="min-height:0;text-align:center"><div class="ph"><b>ASTERON BUSINESS SERVICES</b></div><h2>VISITOR PASS</h2><div style="font:600 22px system-ui">${esc(v.name)}</div><p>${esc(v.org)}<br>Host: ${esc(v.host)}<br>Purpose: ${esc(v.purpose)}<br>In: ${v.inAt} · ${v.date}<br><b>${v.id}</b></p><small>Training simulator — fictional pass</small></div><button class="btn" data-act="ppass" data-id="${v.id}">Print</button>`);render()},
ppass(e){prn($('.md .paper').outerHTML)},
mcancel(e){cf('Cancel this meeting?',()=>{S.meetings.find(m=>m.id==e.dataset.id).status='cancelled';save();render()})},
magenda(e){const m=S.meetings.find(x=>x.id==e.dataset.id);S.flags.agenda=1;save();modal(paper({type:'Meeting Agenda',ref:m.id,date:m.date,to:m.att.join(', '),from:m.org,subject:m.title+' — '+m.start+'–'+m.end+', '+m.room,body:m.agenda||'(none)',status:'draft'}));render()},
tstatus(e){S.tasks.find(t=>t.id==e.dataset.id).status=e.value;log(e.dataset.id+' → '+e.value);save();render()},
rsub(e){const r=S.reqs.find(x=>x.id==e.dataset.id);r.status='submitted';log(r.id+' submitted');save();render();toast('Submitted.')},rapp(e){const r=S.reqs.find(x=>x.id==e.dataset.id);r.status='approved';log(r.id+' approved');save();render();toast('Approved.')},rrej(e){S.reqs.find(x=>x.id==e.dataset.id).status='rejected';save();render()},
rpo(e){const r=S.reqs.find(x=>x.id==e.dataset.id);S.flags.po=1;save();const html=`<div class="paper" style="min-height:0"><div class="ph"><b>ASTERON BUSINESS SERVICES</b><small>Purchase Order — fictional</small></div><h2>PURCHASE ORDER ${r.id.replace('PR','PO')}</h2><p>Vendor: <b>${esc(r.vendor)}</b> · Dept: ${r.dept} · ${today()}</p><table class="meta" style="width:100%"><tr><td>Item</td><td>Qty</td><td>Rate</td><td>Amount</td></tr>${r.items.map(i=>`<tr><td>${esc(i.d)}</td><td>${i.q}</td><td>${i.p}</td><td>${inr(i.q*i.p)}</td></tr>`).join('')}</table><p><b>Total: ${inr(total(r))}</b></p></div>`;modal(html+'<button class="btn" data-act="ppass">Print</button>');render()},
rcsv(){csv('task-report',S.tasks.filter(t=>(!RF.st||t.status==RF.st)&&(!RF.own||t.owner==RF.own)),[['id','ID'],['title','Task'],['owner','Owner'],['due','Due'],['status','Status']])},
rprint(){const r=S.tasks.filter(t=>(!RF.st||t.status==RF.st)&&(!RF.own||t.owner==RF.own));S.flags.printed=1;save();prn(`<h2>Management Task Report — Asteron Business Services (Training)</h2><p>${today()} · Filter: ${RF.st||'all statuses'} / ${RF.own||'all owners'}</p>`+tbl([['ID',t=>t.id],['Task',t=>esc(t.title)],['Owner',t=>esc(t.owner)],['Due',t=>t.due],['Status',t=>t.status]],r,'No data'));render()},
allcsv(e){const k=e.dataset.k;csv(k,S[k].map(x=>({...x,att:(x.att||[]).join('; ')})),Object.keys(S[k][0]||{id:1}).filter(c=>!['items','seed','body','agenda'].includes(c)).map(c=>[c,c]))}};
const F={vis(f){const d=fd(f);if(!d.name.trim()||!d.purpose.trim())return toast('Name and purpose are required.',1);S.visitors.push({id:nid('VIS'),name:d.name,org:d.org||'—',purpose:d.purpose,host:d.host,date:today()});log('Visitor registered: '+d.name);save();render();toast('Visitor registered.')},
mtg(f){const d=fd(f),att=[...f.att.selectedOptions].map(o=>o.value);if(!d.title.trim())return toast('Title is required.',1);if(d.end<=d.start)return toast('End time must be after start time.',1);
const c=S.meetings.find(m=>m.status=='confirmed'&&m.room==d.room&&m.date==d.date&&d.start<m.end&&d.end>m.start);if(c){S.flags.conflict=1;save();render();return toast(`Conflict: ${d.room} is booked ${c.start}–${c.end} (“${c.title}”).`,1)}
S.meetings.push({id:nid('MTG'),title:d.title,date:d.date,start:d.start,end:d.end,room:d.room,org:'Aditi Rao',att,agenda:d.agenda,status:'confirmed'});log('Meeting booked: '+d.title);save();render();toast('Meeting booked.')},
tsk(f){const d=fd(f);if(!d.title.trim())return toast('Title is required.',1);S.tasks.push({id:nid('TSK'),...d,status:'To-do'});log('Task created');save();render()},
req(f){const d=fd(f),items=[];for(const l of d.items.split('\n').filter(x=>x.trim())){const p=l.split(',').map(x=>x.trim()),q=+p[1],pr=+p[2];if(!p[0]||!(q>0)||!(pr>=0)||p.length!=3)return toast('Invalid line: “'+l+'”. Use: description, qty, price',1);items.push({d:p[0],q,p:pr})}
if(!d.title.trim()||!items.length)return toast('Title and at least one line item are required.',1);S.reqs.push({id:nid('PR'),title:d.title,vendor:d.vendor,dept:d.dept,items,status:'draft'});log('Requisition created');save();render();toast('Draft requisition created.')}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();$('#modal').innerHTML='';page=g.dataset.go;render();return}const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a,e)}});
document.addEventListener('submit',e=>{const n=e.target.dataset.form;if(n){e.preventDefault();F[n](e.target)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.chg)A[t.dataset.chg](t);if(t.dataset.rf){RF[t.dataset.rf]=t.value;S.flags.filtered=1;save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&ST){ST[t.dataset.f]=t.value;$('#pv').innerHTML=paper(ST)}if(t.dataset.q!==undefined){Q=t.value;const p=t.selectionStart;render();const i=$('[data-q]');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#modal').innerHTML='';if(e.key=='Enter'&&e.target.id=='gs'){const q=e.target.value.toLowerCase();if(!q)return;const hits=[...S.docs.map(d=>['Document',d.id,d.subject]),...S.mail.map(m=>['Mail',m.id,m.subj]),...S.emps.map(x=>['Employee',x.id,x.name]),...S.visitors.map(v=>['Visitor',v.id,v.name]),...S.tasks.map(t=>['Task',t.id,t.title])].filter(h=>(h[1]+h[2]).toLowerCase().includes(q));modal('<h3>Search results</h3>'+(hits.map(h=>`<div class="st"><span class="mu">${h[0]}</span> ${h[1]} — ${esc(h[2])}</div>`).join('')||'<div class="empty">No matches.</div>'))}if(e.key=='Enter'&&e.target.classList.contains('kpi'))e.target.click()});
render();
</script></body></html>
